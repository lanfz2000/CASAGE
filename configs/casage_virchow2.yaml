vision_encoder: virchow2
cell_feature_mode: grid
use_distance_bias: true
model_dim: 768
heads: 8
dropout: 0.2
img_size: 224
max_cells_per_patch: 256
l_gene: 1.0
l_pg: 0.4
epochs: 20
batch_size_per_gpu: 128
num_workers: 8
lr_head: 0.0002
weight_decay_head: 0.05
lr_encoder: 5.0e-06
lr_encoder_max: 2.0e-05
weight_decay_encoder: 0.01
freeze_encoder_ratio: 0.1
gradual_unfreeze_ratio: 0.3
grad_clip: 1.0
grad_sync: allreduce
val_every: 1
val_batch_size: 32
seed: 42
output_dir: outputs/casage_virchow2
data_root: data/xenium52
patch_index_csv: data/xenium52/all_patches.csv
split_csv: data/xenium52/splits/train_val_test_split.csv
gene_vocab_csv: data/xenium52/gene_vocab.csv
resume: false
virtual_world_size: 1
virtual_rank: 0
legacy_completed_full_epochs: 0
rank0_start_epoch: 0
channels_last: false
stop_after_full_epochs: 5
jitter_pixels: 0.0
architecture: adaptive_grid_provided_target_table_mask
encoder_gradient_checkpointing: true
positive_count_recovery: true
halo_pixels: 0
dynamic_encoder: true
grid_coordinate_mode: patch_center_aligned_border
provided_target_table_mask: true
global_nonzero_gene_filter: false
within_tile_aux_mode: centered
within_tile_aux_coefficient: 4.0
cls_objective: distribution
adaptive_enabled: true
ges_variant: clsmean
